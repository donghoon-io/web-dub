<div class="hero-art hero-slideshow" id="dub-slideshow" role="region" aria-roledescription="carousel" aria-label="Design, Use, Build">
  <div class="hero-slide is-active" role="group" aria-roledescription="slide" aria-label="1 of 3: Design" aria-hidden="false">
    <img src="{{ site.baseurl }}/images/slide_design.jpg" alt="DUB members collaborating at a design workshop" width="1200" height="635">
    <h2>Design</h2>
  </div>
  <div class="hero-slide" role="group" aria-roledescription="slide" aria-label="2 of 3: Use" aria-hidden="true">
    <img src="{{ site.baseurl }}/images/slide_use.jpg" alt="A person testing a paper prototype of an ordering interface" width="1200" height="635">
    <h2>Use</h2>
  </div>
  <div class="hero-slide" role="group" aria-roledescription="slide" aria-label="3 of 3: Build" aria-hidden="true">
    <img src="{{ site.baseurl }}/images/slide_build.jpg" alt="An electronic prototype on a breadboard" width="1200" height="635">
    <h2>Build</h2>
  </div>
  <div class="slideshow-controls">
    <div class="slideshow-dots" role="group" aria-label="Choose a slide">
      <button type="button" data-slide="0" aria-label="Show Design" aria-pressed="true"></button>
      <button type="button" data-slide="1" aria-label="Show Use" aria-pressed="false"></button>
      <button type="button" data-slide="2" aria-label="Show Build" aria-pressed="false"></button>
    </div>
    <div class="slideshow-actions">
      <button class="slideshow-previous" type="button" aria-label="Previous slide">←</button>
      <button class="slideshow-playback" type="button" aria-label="Pause slideshow"><span aria-hidden="true">Ⅱ</span></button>
      <button class="slideshow-next" type="button" aria-label="Next slide">→</button>
    </div>
  </div>
</div>
